<!DOCTYPE html>

<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={"darkMode":"class","theme":{"extend":{"colors":{"on-secondary":"#ffffff","on-surface":"#0b1c30","outline-variant":"#c3c6d7","surface":"#f8f9ff","tertiary":"#943700","on-tertiary-fixed":"#360f00","tertiary-fixed-dim":"#ffb596","on-tertiary":"#ffffff","on-tertiary-container":"#ffede6","on-surface-variant":"#434655","secondary-fixed":"#d5e3fd","error":"#ba1a1a","surface-container-lowest":"#ffffff","inverse-primary":"#b4c5ff","surface-container-high":"#dce9ff","surface-container-highest":"#d3e4fe","on-primary-fixed-variant":"#003ea8","inverse-on-surface":"#eaf1ff","secondary-fixed-dim":"#b9c7e0","on-primary-fixed":"#00174b","surface-bright":"#f8f9ff","on-primary-container":"#eeefff","primary-container":"#2563eb","on-secondary-container":"#57657b","secondary-container":"#d5e3fd","on-error-container":"#93000a","on-secondary-fixed":"#0d1c2f","inverse-surface":"#213145","on-tertiary-fixed-variant":"#7d2d00","surface-container-low":"#eff4ff","on-primary":"#ffffff","surface-variant":"#d3e4fe","surface-container":"#e5eeff","primary-fixed":"#dbe1ff","secondary":"#515f74","error-container":"#ffdad6","on-background":"#0b1c30","background":"#f8f9ff","surface-dim":"#cbdbf5","on-secondary-fixed-variant":"#3a485c","outline":"#737686","surface-tint":"#0053db","tertiary-container":"#bc4800","on-error":"#ffffff","primary":"#004ac6","primary-fixed-dim":"#b4c5ff","tertiary-fixed":"#ffdbcd"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{"gutter":"1.5rem","space-xs":"0.25rem","space-md":"1rem","space-lg":"1.5rem","gutter-mobile":"1rem","space-xl":"2.5rem","margin":"2rem","margin-mobile":"1rem","space-sm":"0.5rem"},"fontFamily":{"caption":["Inter"],"body-lg":["Inter"],"body-md":["Inter"],"label-md":["Inter"],"label-sm":["Inter"],"headline-md":["Inter"],"headline-xl":["Inter"],"body-sm":["Inter"],"headline-xl-mobile":["Inter"],"headline-lg":["Inter"]},"fontSize":{"caption":["11px",{"lineHeight":"14px","letterSpacing":"0.05em","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"400"}],"body-md":["14px",{"lineHeight":"20px","letterSpacing":"0em","fontWeight":"400"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"-0.005em","fontWeight":"500"}],"label-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"headline-md":["20px",{"lineHeight":"28px","letterSpacing":"-0.015em","fontWeight":"600"}],"headline-xl":["36px",{"lineHeight":"44px","letterSpacing":"-0.025em","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"16px","letterSpacing":"0em","fontWeight":"400"}],"headline-xl-mobile":["28px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"600"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"600"}]}}}};</script></head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col justify-center"><main class="w-full bg-surface"><div class="flex flex-col w-full">
<div class="relative w-full flex items-center justify-center p-space-md sm:p-margin min-h-[calc(100vh-4rem)]">
<!-- Fundo com gradiente sutil e formas geométricas translúcidas para profundidade -->
<div class="absolute inset-0 overflow-hidden pointer-events-none flex items-center justify-center -z-10">
<div class="w-[520px] h-[520px] rounded-full bg-surface-container-high/40 blur-3xl -top-24 -left-20 absolute"></div>
<div class="w-[480px] h-[480px] rounded-full bg-secondary-fixed/30 blur-3xl -bottom-24 -right-20 absolute"></div>
</div>
<!-- Card de Autenticação -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-xl p-8 sm:p-10 flex flex-col relative transition-all duration-300">
<!-- Cabeçalho Tipográfico Direto -->
<div class="flex flex-col mb-8 text-left">
<span class="font-caption text-caption text-primary uppercase tracking-widest mb-1.5 font-semibold">Identificação</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-semibold">
          Acessar Conta
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">
          Insira seus dados para continuar
        </p>
</div>
<!-- Formulário de Login -->
<form class="flex flex-col gap-5" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Campo: Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface font-medium flex items-center justify-between" for="emailInput">
<span>E-mail</span>
<span class="font-caption text-caption text-error hidden" id="emailValidationMsg">E-mail inválido</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]">
              mail
            </span>
<input autocomplete="email" class="w-full h-[44px] pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-bright focus:shadow-md transition-all duration-150" id="emailInput" placeholder="nome@empresa.com.br" required="" type="email"/>
</div>
</div>
<!-- Campo: Senha -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface font-medium" for="passwordInput">
            Senha
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]">
              lock
            </span>
<input autocomplete="current-password" class="w-full h-[44px] pl-11 pr-11 bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-bright focus:shadow-md transition-all duration-150" id="passwordInput" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Exibir ou ocultar senha" class="absolute right-2.5 w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface rounded-lg transition-colors focus:outline-none" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="togglePasswordIcon">
                visibility
              </span>
</button>
</div>
</div>
<!-- Opções Secundárias: Lembrar de mim & Esqueci minha senha -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<input class="w-4 h-4 rounded-DEFAULT bg-surface-container-lowest text-primary accent-primary cursor-pointer transition" id="rememberMe" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">
              Lembrar de mim
            </span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors font-medium focus:outline-none focus:underline" href="javascript:void(0)">
            Esqueci minha senha
          </a>
</div>
<!-- Botão Primário: Entrar -->
<div class="pt-2">
<button class="w-full h-[42px] bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:shadow-md hover:bg-primary-container active:scale-[0.99] transition-all flex items-center justify-center gap-2 font-medium focus:outline-none focus:ring-2 focus:ring-primary/40 focus:ring-offset-2" id="submitBtn" type="submit">
<span id="btnText">Entrar</span>
<span class="material-symbols-outlined text-[18px]" id="btnIcon">
              arrow_forward
            </span>
</button>
</div>
</form>
<!-- Rodapé do Card: Cadastro -->
<div class="mt-8 pt-6 bg-transparent flex items-center justify-center gap-1.5">
<span class="font-body-sm text-body-sm text-on-surface-variant">
          Não possui uma conta?
        </span>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container font-semibold transition-colors focus:outline-none focus:underline" href="javascript:void(0)">
          Cadastre-se
        </a>
</div>
</div>
<!-- Indicador de Ambiente Corporativo / Segurança Estrita no Rodapé -->
<div class="absolute bottom-6 flex items-center gap-1.5 text-outline">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-caption text-caption tracking-normal">Conexão segura criptografada</span>
</div>
</div>
<script>
    (function() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const toggleIcon = document.getElementById('togglePasswordIcon');
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');

      // Alternância de visibilidade da senha
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });

      // Feedback de envio
      window.handleLoginSubmit = function() {
        submitBtn.disabled = true;
        btnText.textContent = 'Autenticando...';
        btnIcon.textContent = 'sync';
        btnIcon.classList.add('animate-spin');

        setTimeout(function() {
          btnIcon.classList.remove('animate-spin');
          btnIcon.textContent = 'check';
          btnText.textContent = 'Sucesso';
          submitBtn.classList.remove('bg-primary');
          submitBtn.classList.add('bg-primary-container');
          
          setTimeout(function() {
            submitBtn.disabled = false;
            btnText.textContent = 'Entrar';
            btnIcon.textContent = 'arrow_forward';
            submitBtn.classList.add('bg-primary');
            submitBtn.classList.remove('bg-primary-container');
          }, 1500);
        }, 1000);
      };
    })();
  </script>
</div></main></body></html>
